[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbot"
version = "0.1.0"
description = "A context-aware Discord moderation bot that detects spam and advertisements using rules, similarity, and lightweight machine learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.6",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
modbot = "modbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
